services:
  # PostgreSQL for Write Operations
  postgres-write:
    image: postgres:16
    container_name: postgres-write
    environment:
      POSTGRES_DB: writedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-write-data:/var/lib/postgresql/data
    networks:
      - asspire-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Read Operations
  postgres-read:
    image: postgres:16
    container_name: postgres-read
    environment:
      POSTGRES_DB: readdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-read-data:/var/lib/postgresql/data
    networks:
      - asspire-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - asspire-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - asspire-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: src/Asspire.ProductService/Dockerfile
    container_name: product-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__writedb: Host=postgres-write;Port=5432;Database=writedb;Username=postgres;Password=postgres
      ConnectionStrings__readdb: Host=postgres-read;Port=5432;Database=readdb;Username=postgres;Password=postgres
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__rabbitmq: amqp://guest:guest@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "5001:8080"
    depends_on:
      postgres-write:
        condition: service_healthy
      postgres-read:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - asspire-network
    restart: on-failure

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: src/Asspire.OrderService/Dockerfile
    container_name: order-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__writedb: Host=postgres-write;Port=5432;Database=writedb;Username=postgres;Password=postgres
      ConnectionStrings__readdb: Host=postgres-read;Port=5432;Database=readdb;Username=postgres;Password=postgres
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__rabbitmq: amqp://guest:guest@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      SERVICES__PRODUCTSERVICE__HTTP__0: http://product-service:8080
      SERVICES__PRODUCTSERVICE__HTTPS__0: https://product-service:8081
    ports:
      - "5002:8080"
    depends_on:
      postgres-write:
        condition: service_healthy
      postgres-read:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - asspire-network
    restart: on-failure

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: src/Asspire.Gateway/Dockerfile
    container_name: gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "5000:8080"
    depends_on:
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - asspire-network
    restart: on-failure

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - asspire-network
    restart: on-failure

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    networks:
      - asspire-network

volumes:
  postgres-write-data:
  postgres-read-data:
  rabbitmq-data:
  redis-data:

networks:
  asspire-network:
    driver: bridge
