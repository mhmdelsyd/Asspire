syntax = "proto3";

option csharp_namespace = "Asspire.ProductService.Grpc";

package product;

service ProductGrpc {
  rpc GetProduct (GetProductRequest) returns (ProductReply);
  rpc GetProducts (GetProductsRequest) returns (ProductsReply);
  rpc CheckProductAvailability (CheckAvailabilityRequest) returns (AvailabilityReply);
}

message GetProductRequest {
  int32 id = 1;
}

message GetProductsRequest {
  int32 page_number = 1;
  int32 page_size = 2;
}

message ProductReply {
  int32 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock_quantity = 5;
  string category = 6;
}

message ProductsReply {
  repeated ProductReply products = 1;
  int32 total_count = 2;
}

message CheckAvailabilityRequest {
  int32 product_id = 1;
  int32 quantity = 2;
}

message AvailabilityReply {
  bool is_available = 1;
  int32 available_quantity = 2;
}
